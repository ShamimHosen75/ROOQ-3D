<!doctype html>
<!-- Renders the stand-in hero images (public/images/hero-*.jpg). Run: node tools/render-standins.cjs -->
<html><body style="margin:0"><canvas id="c" width="2040" height="1080"></canvas>
<script>
const frag = `
precision highp float;
uniform vec2 R; uniform vec3 base, deep, zari, motif, sky1, sky2; uniform float seed, motifKind, sheer;
float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))+seed)*43758.5453); }
float n(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(h(i),h(i+vec2(1,0)),u.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),u.x),u.y); }
float fbm(vec2 p){ float a=.5,s=0.; for(int i=0;i<5;i++){ s+=a*n(p); p*=2.03; a*=.5;} return s; }
float bloom(vec2 c, float r, float k){ float a=atan(c.y,c.x); float d=length(c);
  float pet = r*(0.62+0.38*abs(cos(a*k*0.5)));
  return smoothstep(0.012,0.,d-pet) ; }
void main(){
  vec2 uv = gl_FragCoord.xy/R; vec2 p = uv*vec2(R.x/R.y,1.);
  // sky: soft mauve-to-cream with a warm light top right
  vec3 col = mix(sky2, sky1, smoothstep(0.,1.,uv.y));
  col += vec3(1.,.93,.86)*0.18*smoothstep(1.1,0.,length(uv-vec2(.85,1.05)));
  col = mix(col, vec3(1.,.97,.94), 0.18*fbm(p*1.5+3.)); col = mix(col, sky1*0.92, 0.25*smoothstep(0.4,1.,uv.y));
  // distant dunes / haze bottom left
  float dune = smoothstep(0.02,0.,uv.y-0.12-0.05*sin(uv.x*6.+1.)-0.03*fbm(p*3.));
  col = mix(col, vec3(.97,.9,.86), dune*0.8);
  // sheer chiffon ribbons sweeping from the upper right
  for(int i=0;i<4;i++){
    float fi=float(i);
    float y = 0.55+fi*0.11 + 0.18*sin(uv.x*2.3+fi*1.7+seed) + 0.25*(uv.x-0.5);
    float d = abs(uv.y-y);
    float band = smoothstep(0.09,0.0,d)*smoothstep(0.35,0.75,uv.x);
    float edge = smoothstep(0.006,0.,abs(d-0.07))*smoothstep(0.4,0.8,uv.x);
    col = mix(col, vec3(1.), band*0.28*sheer + edge*0.35*sheer);
  }
  // main fabric: a big drape fanning up from the bottom left toward the right edge
  vec2 piv = vec2(0.45,-0.55);
  vec2 q = p - piv; float r = length(q); float ang = atan(q.y,q.x);
  float edgeY = 0.18 + 0.95*smoothstep(0.12,0.95,uv.x) + 0.04*sin(uv.x*9.+seed) ;
  float m = smoothstep(0.004,-0.004, uv.y-edgeY);
  float pleat = sin(ang*38. + 2.*fbm(p*2.)) ; float pleat2 = sin(ang*14.+r*3.+seed);
  float hgt = 0.55*pleat + 0.45*pleat2 + 0.3*sin(r*7.);
  float dx = dFdx(hgt), dy = dFdy(hgt);
  vec3 nrm = normalize(vec3(-dx*60., -dy*60., 1.));
  vec3 L = normalize(vec3(-.5,.6,.7)); float dif = clamp(dot(nrm,L),0.,1.);
  float spec = pow(clamp(dot(nrm, normalize(L+vec3(0,0,1))),0.,1.), 30.);
  vec3 fab = mix(deep, base, smoothstep(0.,1.,dif));
  // motifs on a polar grid riding the pleats
  vec2 g = vec2(ang*13., r*13.); vec2 cell = fract(g)-.5; vec2 id=floor(g);
  float mk = bloom(cell, 0.2+0.06*h(id), motifKind) * step(0.3, h(id+3.)); mk = max(mk, smoothstep(0.015,0.,abs(length(cell)-0.33))*0.6*step(0.5,h(id+5.))); mk = max(mk, smoothstep(0.05,0.03,length(cell-vec2(0.38,0.38)))*0.8);
  float vine = smoothstep(0.03,0.,abs(cell.y-0.12*sin(cell.x*6.)))*0.5*step(0.5,h(id+9.));
  fab = mix(fab, motif*(0.65+0.7*spec+0.3*dif), clamp(mk+vine,0.,1.)*0.85);
  // zari border along the drape edge
  float dEdge = edgeY-uv.y;
  float border = smoothstep(0.0,0.004,dEdge)*smoothstep(0.075,0.068,dEdge);
  float zpat = 0.6+0.4*sin(uv.x*520.+dEdge*300.)*sin(dEdge*900.); border = max(border, smoothstep(0.003,0.,abs(dEdge-0.1))*0.8);
  fab = mix(fab, zari*(0.55+0.5*zpat+0.6*spec), border);
  fab += vec3(1.,.95,.85)*spec*0.18;
  fab *= 0.85+0.25*dif;
  col = mix(col, fab, m);
  // soft drop shadow of the fabric on the sky
  col *= 1.-0.12*smoothstep(0.08,0.,uv.y-edgeY)*(1.-m);
  // petals
  for(int i=0;i<9;i++){ float fi=float(i);
    vec2 c = vec2(h(vec2(fi,1.)), h(vec2(fi,2.))*0.9+0.08)*vec2(R.x/R.y,1.);
    vec2 d = p-c; float a=h(vec2(fi,3.))*6.28; d = mat2(cos(a),-sin(a),sin(a),cos(a))*d;
    float s = 0.008+0.012*h(vec2(fi,4.));
    float pet = smoothstep(1.,0.8,length(d/vec2(s*1.6,s)));
    col = mix(col, mix(vec3(.62,.12,.25), vec3(.85,.35,.45), d.x/s*0.5+0.5), pet*0.9);
  }
  // grain + vignette
  col += (h(gl_FragCoord.xy*0.37)-.5)*0.025;
  col *= 0.92+0.08*smoothstep(1.2,0.3,length(uv-vec2(.45,.55)));
  gl_FragColor = vec4(col,1.);
}`;
const vert = `attribute vec2 a; void main(){ gl_Position=vec4(a,0,1); }`;
const c = document.getElementById('c'); const gl = c.getContext('webgl', { preserveDrawingBuffer: true });
gl.getExtension('OES_standard_derivatives');
const sh=(t,s)=>{const o=gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o); if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o); return o;};
const prog=gl.createProgram(); gl.attachShader(prog,sh(gl.VERTEX_SHADER,vert)); gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,'#extension GL_OES_standard_derivatives : enable\n'+frag)); gl.linkProgram(prog); gl.useProgram(prog);
const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const al=gl.getAttribLocation(prog,'a'); gl.enableVertexAttribArray(al); gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
const hex=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)/255);
window.render = (o) => {
  const u=(n)=>gl.getUniformLocation(prog,n);
  gl.uniform2f(u('R'),c.width,c.height);
  for (const k of ['base','deep','zari','motif','sky1','sky2']) gl.uniform3fv(u(k), hex(o[k]));
  gl.uniform1f(u('seed'), o.seed); gl.uniform1f(u('motifKind'), o.kind); gl.uniform1f(u('sheer'), o.sheer ?? 1);
  gl.drawArrays(gl.TRIANGLES,0,3);
  return c.toDataURL('image/jpeg', 0.86);
};
</script></body></html>
